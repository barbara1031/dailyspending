<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代墊款管理工具</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 900px; margin: auto; background: #f4f6f8; color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .nav button { padding: 10px 20px; cursor: pointer; border: none; background: #e0e0e0; border-radius: 5px; font-weight: bold; transition: 0.2s; }
    .nav button.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f0f0f0; }
    .btn-edit { background: #ffc107; color: #000; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
    .form-group input, .form-group select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btn-save { background: #28a745; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .btn-cancel { background: #6c757d; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .payer-box { background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
    .payer-name { margin-top: 0; color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 5px; display: inline-block; }
  </style>

  <!-- 載入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <h1>💰 代墊款管理工具</h1>

  <!-- 分頁按鈕 -->
  <div class="nav">
    <button class="active" onclick="switchTab('tab-input', this)">📝 明細與編輯</button>
    <button onclick="switchTab('tab-payer', this)">🧑‍🤝‍🧑 代墊金額統計</button>
    <button onclick="switchTab('tab-month', this)">📅 每月統計</button>
  </div>

  <!-- 分頁一：輸入與明細列表 -->
  <div id="tab-input" class="tab-content active card">
    <h2 id="form-title">新增款項</h2>
    <input type="hidden" id="record-id">
    <div class="form-group">
      <input type="date" id="date" required>
      <input type="text" id="item" placeholder="款項名稱" required>
      <input type="number" id="amount" placeholder="金額" required>
      <!-- 修改為指定選項：小明、小美、公基金 -->
      <select id="payer">
        <option value="小明">小明</option>
        <option value="小美">小美</option>
        <option value="公基金">公基金</option>
      </select>
      <button class="btn-save" onclick="saveRecord()">儲存</button>
      <button class="btn-cancel" onclick="resetForm()">取消</button>
    </div>

    <h3>所有帳目明細</h3>
    <table>
      <thead>
        <tr><th>日期</th><th>款項</th><th>金額</th><th>代墊人</th><th>操作</th></tr>
      </thead>
      <tbody id="data-list"></tbody>
    </table>
  </div>

  <!-- 分頁二：代墊金額統計 -->
  <div id="tab-payer" class="tab-content card">
    <h2>代墊金額統計</h2>
    <!-- 個別代墊人統計區塊 -->
    <div id="payer-summary-container"></div>
  </div>

  <!-- 分頁三：每月統計 -->
  <div id="tab-month" class="tab-content card">
    <h2>每月花費總覽</h2>
    <table>
      <thead>
        <tr><th>月份</th><th>總花費金額</th></tr>
      </thead>
      <tbody id="month-summary"></tbody>
    </table>
  </div>

  <script>
    // ⚠️ 請務必將以下欄位替換為您在 Firebase Console 取得的真實 Key ⚠️
const firebaseConfig = {
  apiKey: "AIzaSyBZ0l-GOETrFWhM6C7Ku-JIvI8RWHXIF6A",
  authDomain: "dailyspending.firebaseapp.com",
  projectId: "dailyspending",
  storageBucket: "dailyspending.firebasestorage.app",
  messagingSenderId: "913420870988",
  appId: "1:913420870988:web:683a8184fd87b9ea729be9",
  measurementId: "G-BDTVMFCJYM"
};
    let db;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (e) {
      console.error("Firebase 初始化失敗：", e);
    }

    let allRecords = [];

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('date').valueAsDate = new Date();
      
      if (!db) {
        alert("Firebase 初始化失敗！請檢查你的 firebaseConfig 是否有填寫正確（需保留引號與逗號）。");
        return;
      }
    // 即時監聽 Firebase 資料庫變更
    db.collection("expenses").onSnapshot((snapshot) => {
      allRecords = [];
      snapshot.forEach((doc) => {
        allRecords.push({ id: doc.id, ...doc.data() });
      });
      renderAll();
    }, (error) => {
      console.error("Firebase 讀取錯誤：", error);
      alert("無法連接資料庫，請檢查 Firebase 設定與權限！");
    });

    // 儲存或修改資料
    function saveRecord() {
      const id = document.getElementById('record-id').value;
      const date = document.getElementById('date').value;
      const item = document.getElementById('item').value;
      const amount = Number(document.getElementById('amount').value);
      const payer = document.getElementById('payer').value;

      if (!date || !item || isNaN(amount) || amount <= 0) {
        return alert("請完整填寫日期、款項名稱與金額！");
      }

      const data = { date, item, amount, payer };

      if (id) {
        db.collection("expenses").doc(id).update(data)
          .then(() => resetForm())
          .catch(err => alert("修改失敗：" + err.message));
      } else {
        db.collection("expenses").add(data)
          .then(() => resetForm())
          .catch(err => alert("新增失敗：" + err.message));
      }
    }

    // 刪除資料
    function deleteRecord(id) {
      if (confirm("確定要刪除這筆紀錄嗎？")) {
        db.collection("expenses").doc(id).delete()
          .catch(err => alert("刪除失敗：" + err.message));
      }
    }

    // 編輯資料
    function editRecord(id) {
      const item = allRecords.find(r => r.id === id);
      if (item) {
        document.getElementById('record-id').value = item.id;
        document.getElementById('date').value = item.date;
        document.getElementById('item').value = item.item;
        document.getElementById('amount').value = item.amount;
        document.getElementById('payer').value = item.payer;
        document.getElementById('form-title').innerText = "修改款項";
      }
    }

    // 重置表單
    function resetForm() {
      document.getElementById('record-id').value = '';
      document.getElementById('item').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('form-title').innerText = "新增款項";
    }

    // 渲染所有分頁資料
    function renderAll() {
      // 1. 明細列表
      const listBody = document.getElementById('data-list');
      listBody.innerHTML = allRecords.map(r => `
        <tr>
          <td>${r.date}</td>
          <td>${r.item}</td>
          <td>$${r.amount}</td>
          <td>${r.payer}</td>
          <td>
            <button class="btn-edit" onclick="editRecord('${r.id}')">編輯</button>
            <button class="btn-delete" onclick="deleteRecord('${r.id}')">刪除</button>
          </td>
        </tr>
      `).join('');

      // 2. 代墊金額統計 (依個人逐一列出明細與總金額)
      const payerContainer = document.getElementById('payer-summary-container');
      const defaultPayers = ["小明", "小美", "公基金"];
      // 確保即使歷史紀錄包含其他名字也能正常列出
      const allPayers = Array.from(new Set([...defaultPayers, ...allRecords.map(r => r.payer)])).filter(Boolean);

      let payerHtml = '';
      allPayers.forEach(payer => {
        const payerRecords = allRecords.filter(r => r.payer === payer);
        const totalAmount = payerRecords.reduce((sum, r) => sum + r.amount, 0);

        payerHtml += `
          <div class="payer-box">
            <h3 class="payer-name">代墊人：${payer}</h3>
            ${payerRecords.length === 0 ? '<p style="color: #888;">目前尚無代墊紀錄</p>' : `
              <table>
                <thead>
                  <tr><th>日期</th><th>代墊項目</th><th>金額</th></tr>
                </thead>
                <tbody>
                  ${payerRecords.map(r => `
                    <tr>
                      <td>${r.date}</td>
                      <td>${r.item}</td>
                      <td>$${r.amount}</td>
                    </tr>
                  `).join('')}
                </tbody>
                <tfoot>
                  <tr style="background: #f0f0f0; font-weight: bold;">
                    <td colspan="2" style="text-align: right;">總共代墊金額：</td>
                    <td style="color: #dc3545; font-size: 16px;">$${totalAmount}</td>
                  </tr>
                </tfoot>
              </table>
            `}
          </div>
        `;
      });
      payerContainer.innerHTML = payerHtml;

      // 3. 每月統計
      const monthSummary = {};
      allRecords.forEach(r => {
        const month = r.date ? r.date.substring(0, 7) : '未知';
        monthSummary[month] = (monthSummary[month] || 0) + r.amount;
      });

      document.getElementById('month-summary').innerHTML = Object.keys(monthSummary).map(m => `
        <tr>
          <td>${m}</td>
          <td>$${monthSummary[m]}</td>
        </tr>
      `).join('');
    }

    // 切換分頁 UI
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
